name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end smoke test (Kafka)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOG_FORMAT: json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      # Keycloak issues the OAuth2 tokens the load generator and dlq-replay use.
      # No secrets needed: the demo realm (infra/keycloak) ships its own demo credentials,
      # and without LD_SDK_KEY every service uses the local feature-flag provider.
      - name: Start Kafka, Keycloak and Postgres
        run: docker compose up -d --wait kafka keycloak postgres

      - name: Start services
        run: |
          mkdir -p logs
          for s in order payment inventory notification gateway; do
            nohup npm start -w @orderflow/$s-service > logs/$s.log 2>&1 &
          done
          timeout 60 bash -c 'until curl -sf localhost:3000/health; do sleep 1; done'
          timeout 60 bash -c 'until curl -sf localhost:3001/health; do sleep 1; done'
          timeout 60 bash -c 'until curl -sf localhost:3002/health; do sleep 1; done'

      - name: API rejects unauthenticated requests
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3000/orders)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/orders/some-id)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3001/inventory)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3002/stream)" = 401

      - name: Orders flow through the pipeline
        run: npm run load -- --count 30 --rate 15 --scenario mixed --wait --timeout 60

      - name: Gateway streams live events
        run: |
          TOKEN=$(curl -s -d grant_type=password -d client_id=orderflow-cli -d username=alice -d password=alice \
            localhost:8081/realms/orderflow/protocol/openid-connect/token | node -pe 'JSON.parse(require("fs").readFileSync(0)).access_token')
          # Open the stream, place an order while it is open, and expect the snapshot, stock and order events.
          (timeout 12 curl -sN localhost:3002/stream -H "authorization: Bearer $TOKEN" > stream.txt || true) &
          sleep 3
          curl -sf -X POST localhost:3000/orders -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d '{"customerId":"alice","items":[{"sku":"SKU-MOUSE","quantity":1,"unitPrice":25}]}'
          wait
          grep -q '^event: snapshot' stream.txt
          grep -q '^event: flags' stream.txt
          grep -q '^event: stock' stream.txt
          grep -q 'order.created' stream.txt

      - name: Duplicates are skipped
        run: |
          npm run load -- --count 5 --rate 5 --duplicate --wait --timeout 60
          grep -q 'duplicate event skipped' logs/payment.log
          grep -q 'duplicate event skipped' logs/inventory.log

      - name: Poison messages go to the DLQ
        run: |
          npm run load -- --poison 5
          # 5 poison messages x 2 consumer groups (payment + inventory)
          timeout 60 bash -c 'until npm run --silent dlq:replay -- -t orders.created.dlq --dry-run --reason invalid-message | grep -q "would replay 10"; do sleep 2; done'

      - name: Service logs
        if: always()
        run: tail -n 100 logs/*.log || true
